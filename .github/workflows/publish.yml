name: Publish to PyPI

# Publishes on a GitHub Release. Uses PyPI's trusted publishing (OIDC): no API token to
# create, store, or rotate. One-time setup on pypi.org before the first run - see
# README.md's "Publishing a release" section.

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pivot2hist/
    permissions:
      id-token: write  # required for trusted publishing; no secrets.PYPI_API_TOKEN needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
